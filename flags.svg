<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Shared five-point star, unit outer radius, centred on 0,0 -->
  <symbol id="star" viewBox="-1 -1 2 2">
    <path d="M0,-1 L0.2245,-0.309 L0.9511,-0.309 L0.3633,0.118 L0.5878,0.809 L0,0.382 L-0.5878,0.809 L-0.3633,0.118 L-0.9511,-0.309 L-0.2245,-0.309 Z"/>
  </symbol>

  <!-- Texas: blue hoist bar with a single white star, white over red -->
  <symbol id="tx" viewBox="0 0 60 40">
    <rect width="60" height="40" fill="#fff"/>
    <rect x="20" y="20" width="40" height="20" fill="#BF0A30"/>
    <rect width="20" height="40" fill="#002868"/>
    <use href="#star" xlink:href="#star" x="2.5" y="12.5" width="15" height="15" fill="#fff"/>
  </symbol>

  <!-- Georgia (2003): red, white, red stripes; blue canton with 13 stars around a gold arch -->
  <symbol id="ga" viewBox="0 0 60 40">
    <rect width="60" height="40" fill="#BF0A30"/>
    <rect y="13.333" width="60" height="13.334" fill="#fff"/>
    <rect width="24" height="26.667" fill="#002868"/>
    <g fill="#fff">
      <use href="#star" xlink:href="#star" x="10.8" y="3.6" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="14.8" y="4.5" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="17.9" y="7.1" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="19.4" y="10.9" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="18.8" y="14.9" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="16.4" y="18.2" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="12.8" y="19.9" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="8.8" y="19.9" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="5.2" y="18.2" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="2.8" y="14.9" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="2.2" y="10.9" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="3.7" y="7.1" width="2.4" height="2.4"/>
      <use href="#star" xlink:href="#star" x="6.8" y="4.5" width="2.4" height="2.4"/>
    </g>
    <g fill="none" stroke="#D4A017" stroke-width=".8" stroke-linecap="round">
      <path d="M8.6,14.2 A3.4,3.4 0 0 1 15.4,14.2"/>
      <path d="M9.4,11.9 V16.2 M12,10.8 V16.2 M14.6,11.9 V16.2"/>
      <path d="M8.2,16.4 H15.8"/>
      <path d="M9.2,18 H14.8"/>
    </g>
  </symbol>
</svg>
